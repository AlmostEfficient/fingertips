<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingertips</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header>
      <h1>Fingertips</h1>
      <p class="subtitle">Gesture control for iCloud Photos</p>
    </header>

    <section class="control">
      <label class="toggle">
        <input type="checkbox" id="activation-toggle" />
        <span>Enable camera preview on this tab</span>
      </label>
      <div class="control-buttons">
        <button id="request-camera" class="ghost">Request camera</button>
        <button id="start-engine" class="ghost">Start gesture engine</button>
        <button id="stop-engine" class="ghost">Stop gesture engine</button>
        <button id="grant-camera" class="ghost">Grant camera permission</button>
      </div>
    </section>

    <section class="status" id="status"></section>

    <section class="mappings">
      <h2>Gesture mappings</h2>
      <div id="mappings"></div>
    </section>

    <footer>
      <button id="restore-defaults" class="ghost">Restore defaults</button>
    </footer>
  </div>

  <template id="mapping-row">
    <div class="mapping-row">
      <span class="action-label"></span>
      <div class="mapping-controls">
        <label class="field">
          <span class="field-label">Gesture</span>
          <select class="gesture-select"></select>
        </label>
        <label class="field">
          <span class="field-label">Hand</span>
          <select class="hand-select"></select>
        </label>
      </div>
    </div>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
